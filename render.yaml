services:
  - type: web
    name: college-platform-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Requires user to set it via Render Dashboard
      - key: JWT_SECRET
        sync: false # Requires user to set it via Render Dashboard
      - key: CLIENT_URL
        value: https://collegefinder-seven.vercel.app
      - key: GOOGLE_API_KEY
        sync: false # Set via Render Dashboard for security
      - key: GEMINI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
